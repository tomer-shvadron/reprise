name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs only, so every commit on main keeps a verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Branch protection on main requires a check named `ci`; renaming this job breaks merging.
  ci:
    name: ci
    # Pinned, since the pixel baselines are this image's; moving it re-accepts them in its own PR.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Read from the lockfile rather than node_modules so the browser cache can be restored
      # before `pnpm install`.
      - name: Resolve Playwright version
        id: playwright
        run: |
          version=$(grep -m1 -oE '^  playwright@[0-9][^:]*' pnpm-lock.yaml | cut -d@ -f2)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The browser download waits until the deterministic checks have passed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      # First of the checks, so a conflict fails with path:line rather than a parse error; format:check
      # accepts the forms Prettier rewrites markers into in Markdown.
      - name: Conflict markers
        run: pnpm conflicts:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format
        run: pnpm format:check

      # No `--with-deps`: ubuntu-latest already carries the shell's libraries, and its apt font
      # install from the Azure mirror has taken over 11 minutes.
      - name: Install Chromium headless shell
        id: chromium
        timeout-minutes: 5
        run: pnpm exec playwright install chromium --only-shell

      # About 32 MB from GitHub, cached on the pins, so the GeneralUser GS suite runs in CI too.
      - name: Cache the GM soundfont
        uses: actions/cache@v6
        with:
          # The fetched files only: restoring the directory would overwrite its committed README.
          path: |
            apps/web/public/sounds/gm/GeneralUser-GS.sf2
            apps/web/public/sounds/gm/LICENSE.txt
          key: gm-soundfont-${{ hashFiles('scripts/sounds/gm.json') }}

      - name: Fetch the GM soundfont
        run: pnpm sounds:fetch

      - name: Test
        run: pnpm test

      # After the parallel suite, so the budget measurements have the runner to themselves.
      - name: Bench
        timeout-minutes: 5
        run: pnpm bench

      # Re-describes every fixture with alphaTab, the dev-only oracle, and fails when
      # fixtures/manifest.json no longer matches the files.
      - name: Fixtures
        run: pnpm fixtures:check

      # The real-file pass over the fixture corpus: reading, alphaTab parity of reading, playback
      # order and tempo, A4 layout invariants and a GM render (docs/reference/player-checklist.md).
      - name: Real-file pass
        id: files
        timeout-minutes: 5
        run: pnpm check:files fixtures

      - name: Upload the real-file report
        if: ${{ !cancelled() && steps.files.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: check-files
          path: |
            .check-files/
            !.check-files/natives/
          retention-days: 14
          if-no-files-found: warn

      - name: Build
        run: pnpm build

      # Pixel baselines are CI's own (Linux); runs even when Test failed, so one run shows both.
      - name: Visual
        id: visual
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        timeout-minutes: 5
        run: pnpm test:visual

      - name: Upload print PDFs
        if: ${{ !cancelled() && steps.visual.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: print-pdfs
          path: apps/web/.vitest/print/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload visual diffs
        if: ${{ !cancelled() && steps.visual.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff
          path: apps/web/.vitest/attachments/
          retention-days: 14
          if-no-files-found: warn

  # The player flows in Chromium against the production build (ADR-0025). A job of its own, so it
  # runs beside `ci` and the budget measurements have the runner to themselves. Branch protection
  # requires it by this name too.
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Resolve Playwright version
        id: playwright
        run: |
          version=$(grep -m1 -oE '^  playwright@[0-9][^:]*' pnpm-lock.yaml | cut -d@ -f2)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Install Chromium headless shell
        timeout-minutes: 5
        run: pnpm exec playwright install chromium --only-shell

      - name: Cache the GM soundfont
        uses: actions/cache@v6
        with:
          path: |
            apps/web/public/sounds/gm/GeneralUser-GS.sf2
            apps/web/public/sounds/gm/LICENSE.txt
          key: gm-soundfont-${{ hashFiles('scripts/sounds/gm.json') }}

      - name: Fetch the GM soundfont
        run: pnpm sounds:fetch

      - name: E2E
        id: e2e
        timeout-minutes: 6
        run: pnpm e2e

      - name: Upload e2e traces and videos
        if: ${{ !cancelled() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 14
          if-no-files-found: warn

  # Benches the PR's budgeted rows against main on one runner, alternating, and fails on a relative
  # slowdown (docs/plans/roadmap.md#budgets). Not a required check yet; the roadmap says when it becomes one.
  bench-compare:
    name: bench-compare
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The merge commit and its first parent, main as the PR would land on it.
          fetch-depth: 2
          # No PR code gets the token; the label step passes it explicitly.
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Reports success without benching when no watched path changed, so the check never sits pending.
      - name: Watched paths
        id: gate
        run: node scripts/bench/compare-run.ts gate HEAD^1

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Install main
        if: steps.gate.outputs.run == 'true'
        run: |
          git worktree add --detach "$RUNNER_TEMP/main" HEAD^1
          pnpm --dir "$RUNNER_TEMP/main" install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      # Read live, not from the event payload, so adding the label and re-running this job is enough.
      - name: Accepted slowdown
        id: label
        if: steps.gate.outputs.run == 'true'
        run: |
          accepted=$(gh api "repos/$REPO/issues/$PR/labels" --jq 'any(.[]; .name == "bench:accept-slower")')
          echo "accepted=$accepted" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}

      - name: Bench against main
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 10
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/bench/compare-run.ts "$RUNNER_TEMP/main" ${{ steps.label.outputs.accepted == 'true' && '--accept-slower' || '' }}
