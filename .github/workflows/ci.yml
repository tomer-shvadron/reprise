name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs only, so every commit on main keeps a verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The checks run as parallel jobs. Branch protection on main requires one check named `ci`, which
  # is the aggregator at the end of this file; renaming it breaks merging. Every other job here is
  # a need of that aggregator, so adding a check job means adding it to its `needs`.

  # The deterministic checks, none of which needs a browser.
  static:
    name: static
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the workspace
        uses: ./.github/actions/setup

      # First of the checks, so a conflict fails with path:line rather than a parse error; format:check
      # accepts the forms Prettier rewrites markers into in Markdown.
      - name: Conflict markers
        run: pnpm conflicts:check

      - name: Raw colours
        run: pnpm colors:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format
        run: pnpm format:check

  # `pnpm test` as three groups of Vitest projects, balanced by their CI test time. The projects of
  # each group are listed here and checked against vitest.config.ts by scripts/ci/vitest-groups.test.ts,
  # which fails when a project is in no group or in two.
  unit:
    name: unit (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: web
            projects: web
            chromium: none
          - group: node-engines
            projects: model formats layout audio-node desktop scripts
            chromium: none
          - group: chromium
            projects: audio web-browser layout-worker
            chromium: shell
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the workspace
        uses: ./.github/actions/setup
        with:
          chromium: ${{ matrix.chromium }}
          soundfont: 'true'

      - name: Test
        env:
          PROJECTS: ${{ matrix.projects }}
        run: |
          args=()
          for project in $PROJECTS; do args+=(--project "$project"); done
          pnpm exec vitest run "${args[@]}"

  # Alone on its runner, so the budget measurements are not disturbed by the other jobs' neighbours
  # on the same machine.
  bench:
    name: bench
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the workspace
        uses: ./.github/actions/setup
        with:
          chromium: shell
          soundfont: 'true'

      - name: Bench
        timeout-minutes: 5
        run: pnpm bench

  # Fixtures, the real-file pass and the painter's pixel baselines.
  files:
    name: files
    # Pinned, since the pixel baselines are this image's; moving it re-accepts them in its own PR.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the workspace
        id: setup
        uses: ./.github/actions/setup
        with:
          chromium: shell
          soundfont: 'true'

      # Re-describes every fixture with alphaTab, the dev-only oracle, and fails when
      # fixtures/manifest.json no longer matches the files.
      - name: Fixtures
        run: pnpm fixtures:check

      # The real-file pass over the fixture corpus: reading, alphaTab parity of reading, playback
      # order and tempo, A4 layout invariants and a GM render (docs/reference/player-checklist.md).
      - name: Real-file pass
        id: files
        timeout-minutes: 5
        run: pnpm check:files fixtures

      - name: Upload the real-file report
        if: ${{ !cancelled() && steps.files.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: check-files
          path: |
            .check-files/
            !.check-files/natives/
          retention-days: 14
          if-no-files-found: warn

      # Pixel baselines are CI's own (Linux); runs even when the real-file pass failed, so one run
      # shows both, but not after a failed setup.
      - name: Visual
        id: visual
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 5
        run: pnpm test:visual

      - name: Upload print PDFs
        if: ${{ !cancelled() && steps.visual.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: print-pdfs
          path: apps/web/.vitest/print/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload visual diffs
        if: ${{ !cancelled() && steps.visual.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff
          path: apps/web/.vitest/attachments/
          retention-days: 14
          if-no-files-found: warn

  # The production build, once: it is checked here and the e2e shards serve this same output.
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The soundfont is copied into dist/ from public/, and the e2e flows load it from there.
      - name: Set up the workspace
        uses: ./.github/actions/setup
        with:
          soundfont: 'true'

      - name: Build
        run: pnpm build

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist/
          # Long enough for "Re-run failed jobs" on a shard the next morning.
          retention-days: 7
          if-no-files-found: error

  # The one required check (scripts/github/protect-main.sh). Runs even when a job it needs failed or
  # was cancelled or skipped, and passes only when every one of them succeeded.
  ci:
    name: ci
    if: ${{ always() }}
    needs: [static, unit, bench, files, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null

  # The player flows in Chromium against the production build (ADR-0025), in three shards of one
  # worker each (the audio checks want a machine to themselves) serving the build job's output.
  # Runs beside `ci` and is not required by branch protection (AGENTS.md).
  e2e-shard:
    name: e2e shard ${{ matrix.shard }}/3
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the workspace
        uses: ./.github/actions/setup
        with:
          chromium: full
          soundfont: 'true'

      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist

      - name: E2E
        id: e2e
        timeout-minutes: 15
        env:
          # Serve the downloaded build instead of building again (apps/web/playwright.config.ts).
          E2E_PREBUILT: '1'
        run: pnpm e2e --shard=${{ matrix.shard }}/3

      - name: Upload e2e traces and videos
        if: ${{ !cancelled() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ matrix.shard }}
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 14
          if-no-files-found: warn

  e2e:
    name: e2e
    if: ${{ always() }}
    needs: [e2e-shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every shard succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null

  # Benches the PR's budgeted rows against main on one runner, alternating, and fails on a relative
  # slowdown (docs/plans/roadmap.md#budgets). Not a required check yet; the roadmap says when it becomes one.
  bench-compare:
    name: bench-compare
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The merge commit and its first parent, main as the PR would land on it.
          fetch-depth: 2
          # No PR code gets the token; the label step passes it explicitly.
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Reports success without benching when no watched path changed, so the check never sits pending.
      - name: Watched paths
        id: gate
        run: node scripts/bench/compare-run.ts gate HEAD^1

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        # No PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: the root postinstall is this job's only Chromium
        # install, and the audio bench runs in the browser. The install of main below also downloads, so a PR that bumps Playwright benches both sides.
        run: pnpm install --frozen-lockfile

      - name: Install main
        if: steps.gate.outputs.run == 'true'
        run: |
          git worktree add --detach "$RUNNER_TEMP/main" HEAD^1
          pnpm --dir "$RUNNER_TEMP/main" install --frozen-lockfile

      # Read live, not from the event payload, so adding the label and re-running this job is enough.
      - name: Accepted slowdown
        id: label
        if: steps.gate.outputs.run == 'true'
        run: |
          accepted=$(gh api "repos/$REPO/issues/$PR/labels" --jq 'any(.[]; .name == "bench:accept-slower")')
          echo "accepted=$accepted" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}

      - name: Bench against main
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 10
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/bench/compare-run.ts "$RUNNER_TEMP/main" ${{ steps.label.outputs.accepted == 'true' && '--accept-slower' || '' }}
