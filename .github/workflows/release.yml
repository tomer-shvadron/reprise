# Packages the desktop app on macOS (arm64 and x64) and Windows, smoke-tests each installer's app
# on the runner that built it, and on a v* tag turns the installers into a draft GitHub release.
# docs/reference/release.md says how to cut one.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/release/**
      # Everything the desktop build reads: the renderer's entry and its config, the policy, the
      # sound bank fetch, the scripts the jobs run, and the toolchain pins. A change to the web
      # app's other source does not run this; docs/reference/release.md says to dispatch the
      # workflow on the commit to tag.
      - apps/desktop/**
      - apps/web/index.html
      - apps/web/package.json
      - apps/web/public/**
      - apps/web/vite.config.ts
      - apps/web/src/csp.ts
      - scripts/desktop/**
      - scripts/release/**
      - scripts/sounds/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .nvmrc
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  # Cancel superseded PR runs only; a tag's run is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Cheap checks on a tag first, so a bad tag costs seconds and not the macOS minutes.
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The whole history, for the is-ancestor check below.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # A tag names the version; anything else gets a throwaway one so the packaging is the same.
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            node scripts/release/version.ts "$GITHUB_REF_NAME"
          else
            echo "version=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      # A tag on a branch commit would ship code main never saw.
      - name: Tag is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      # A re-run, or a second run on the same tag, would make a second draft or fail late: stop
      # before the packaging. Recovery is in docs/reference/release.md.
      - name: No release for this tag yet
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::a release for $GITHUB_REF_NAME already exists. Delete the draft (gh release delete $GITHUB_REF_NAME, without --cleanup-tag) and re-run; see docs/reference/release.md"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  package:
    name: package (${{ matrix.name }})
    needs: gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      # One runner failing must not hide the other two's verdicts.
      fail-fast: false
      matrix:
        include:
          # Every arch is built natively, so the smoke runs on what it built.
          - { name: mac-arm64, runner: macos-15, flags: '--mac --arm64' }
          - { name: mac-x64, runner: macos-15-intel, flags: '--mac --x64' }
          - { name: windows-x64, runner: windows-2025, flags: '--win --x64' }
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The smoke drives Electron, not a Playwright browser; electron-builder fetches its own
      # Electron zip.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Cache the GM soundfont
        uses: actions/cache@v6
        with:
          path: |
            apps/web/public/sounds/gm/GeneralUser-GS.sf2
            apps/web/public/sounds/gm/LICENSE.txt
          key: gm-soundfont-${{ hashFiles('scripts/sounds/gm.json') }}

      # pnpm appends the flags to the script's last command, electron-builder. --publish never so a
      # tag never makes electron-builder publish on its own; the release job does that.
      - name: Build
        run: pnpm --filter @reprise/desktop build ${{ matrix.flags }} --publish never -c.extraMetadata.version="$VERSION"
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # An invalid arm64 signature shows as "Reprise is damaged" in the browser, which is a
      # different failure from the expected unsigned warning.
      - name: Verify the macOS signature
        if: runner.os == 'macOS'
        run: |
          app=(apps/desktop/release/mac*/Reprise.app)
          codesign --verify --deep --strict --verbose=2 "${app[0]}"
          # The smoke reads the version from the packaged package.json; this is the one the Finder
          # and About show.
          plist=$(plutil -extract CFBundleShortVersionString raw "${app[0]}/Contents/Info.plist")
          test "$plist" = "$VERSION"
        env:
          VERSION: ${{ needs.gate.outputs.version }}

      - name: Smoke
        run: pnpm desktop:smoke
        env:
          REPRISE_EXPECTED_VERSION: ${{ needs.gate.outputs.version }}

      - name: Upload the installers
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.name }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
          retention-days: 14
          if-no-files-found: error

  release:
    name: release
    needs: [gate, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Only for .github/release/install.md; gh gets its token from GH_TOKEN, so none is kept.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the installers
        uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true

      - name: Check the installers and write the checksums
        working-directory: installers
        run: |
          find . -type f -ls
          expected=(
            "Reprise-${VERSION}-mac-arm64.dmg"
            "Reprise-${VERSION}-mac-arm64.zip"
            "Reprise-${VERSION}-mac-x64.dmg"
            "Reprise-${VERSION}-mac-x64.zip"
            "Reprise-${VERSION}-windows-x64-setup.exe"
          )
          actual=$(find . -type f -printf '%P\n' | LC_ALL=C sort)
          wanted=$(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          if [ "$actual" != "$wanted" ]; then
            echo "::error::the installers are not exactly the five expected"
            diff <(echo "$wanted") <(echo "$actual") || true
            exit 1
          fi
          sha256sum "${expected[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
        env:
          VERSION: ${{ needs.gate.outputs.version }}

      # Always a draft: the owner publishes by hand. A pre-release version is also marked
      # prerelease, so it never becomes "Latest". --notes-file text comes before the generated
      # notes. No --notes-start-tag: GitHub takes the previous tag from the latest published
      # release, so until v1.0.0 is published every candidate lists the whole history, which is
      # what a first release should show. After v1.0.0, pass the last published tag.
      - name: Create the draft release
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            --draft --verify-tag --generate-notes \
            --notes-file .github/release/install.md \
            --title "Reprise $VERSION" \
            "${flags[@]}" \
            installers/*.dmg installers/*.zip installers/*.exe installers/SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
          PRERELEASE: ${{ needs.gate.outputs.prerelease }}
