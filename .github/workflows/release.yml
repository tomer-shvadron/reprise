# Packages the desktop app on macOS (arm64 and x64) and Windows, smoke-tests each installer's app
# on the runner that built it, and on a v* tag turns the installers into a draft GitHub release.
# docs/reference/release.md says how to cut one.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/release/**
      - apps/desktop/**
      - apps/web/index.html
      - apps/web/public/theme-bootstrap.js
      - apps/web/src/csp.ts
      - scripts/desktop/**
      - scripts/release/**
      - pnpm-lock.yaml
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  # Cancel superseded PR runs only; a tag's run is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      # One runner failing must not hide the other two's verdicts.
      fail-fast: false
      matrix:
        include:
          # Every arch is built natively, so the smoke runs on what it built.
          - { name: mac-arm64, runner: macos-15, flags: '--mac --arm64' }
          - { name: mac-x64, runner: macos-15-intel, flags: '--mac --x64' }
          - { name: windows-x64, runner: windows-2025, flags: '--win --x64' }
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The smoke drives Electron, not a Playwright browser; electron-builder fetches its own
      # Electron zip.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      # A tag names the version; anything else gets a throwaway one so the packaging is the same.
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            node scripts/release/version.ts "$GITHUB_REF_NAME"
          else
            echo "version=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache the GM soundfont
        uses: actions/cache@v6
        with:
          path: |
            apps/web/public/sounds/gm/GeneralUser-GS.sf2
            apps/web/public/sounds/gm/LICENSE.txt
          key: gm-soundfont-${{ hashFiles('scripts/sounds/gm.json') }}

      # pnpm appends the flags to the script's last command, electron-builder. --publish never so a
      # tag never makes electron-builder publish on its own; the release job does that.
      - name: Build
        run: pnpm --filter @reprise/desktop build ${{ matrix.flags }} --publish never -c.extraMetadata.version="$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # An invalid arm64 signature shows as "Reprise is damaged" in the browser, which is a
      # different failure from the expected unsigned warning.
      - name: Verify the macOS signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 apps/desktop/release/mac*/Reprise.app

      - name: Smoke
        run: pnpm desktop:smoke
        env:
          REPRISE_EXPECTED_VERSION: ${{ steps.version.outputs.version }}

      - name: Upload the installers
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.name }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
          retention-days: 14
          if-no-files-found: error

  release:
    name: release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The whole history, for the is-ancestor check below.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # A tag on a branch commit would ship code main never saw.
      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Version
        id: version
        run: node scripts/release/version.ts "$GITHUB_REF_NAME"

      - name: Download the installers
        uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true

      - name: Check the installers and write the checksums
        working-directory: installers
        run: |
          find . -type f -ls
          expected=(
            "Reprise-${VERSION}-mac-arm64.dmg"
            "Reprise-${VERSION}-mac-arm64.zip"
            "Reprise-${VERSION}-mac-x64.dmg"
            "Reprise-${VERSION}-mac-x64.zip"
            "Reprise-${VERSION}-windows-x64-setup.exe"
          )
          actual=$(find . -type f -printf '%P\n' | LC_ALL=C sort)
          wanted=$(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          if [ "$actual" != "$wanted" ]; then
            echo "::error::the installers are not exactly the five expected"
            diff <(echo "$wanted") <(echo "$actual") || true
            exit 1
          fi
          sha256sum "${expected[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
        env:
          VERSION: ${{ steps.version.outputs.version }}

      # Always a draft: the owner publishes by hand. A pre-release version is also marked
      # prerelease, so it never becomes "Latest". --notes-file text comes before the generated notes.
      - name: Create the draft release
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            --draft --verify-tag --generate-notes \
            --notes-file .github/release/install.md \
            --title "Reprise $VERSION" \
            "${flags[@]}" \
            installers/*.dmg installers/*.zip installers/*.exe installers/SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
