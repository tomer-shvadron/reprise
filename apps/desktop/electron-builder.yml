# Unsigned on purpose (ADR-0003): identity null stops electron-builder looking for a certificate.
appId: app.reprise.desktop
productName: Reprise
directories:
  output: release
files:
  - out/**
  - package.json
npmRebuild: false
# Fuses are flipped here, not in an afterPack hook: electron-builder 26 applies this block itself
# (through @electron/fuses) after packing and before signing, so a hook would only repeat it.
# The renderer loads from reprise://app, so file:// needs no privileges and the app is only ever
# loaded from its asar. The app is not a Node runtime: no ELECTRON_RUN_AS_NODE, NODE_OPTIONS or
# --inspect. pnpm desktop:smoke checks the shipped bytes (scripts/desktop/fuses.ts).
# Flipping a fuse breaks the ad-hoc signature, which identity null would otherwise leave invalid on arm64.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  # electron-builder embeds the asar header hash on both platforms; this makes the app check it.
  enableEmbeddedAsarIntegrityValidation: true
  # Off on purpose: on macOS it keys off the Keychain under the app's signature, and an ad hoc
  # signature changes every build, so each update would raise a Keychain prompt.
  enableCookieEncryption: false
  grantFileProtocolExtraPrivileges: false
  resetAdHocDarwinSignature: true
mac:
  category: public.app-category.music
  identity: null
  # No arch lists: a local `pnpm desktop:build` packages the host arch only, and the release
  # workflow names each arch with --arm64 / --x64 on its own runner. The name carries the arch
  # because the default gives the x64 dmg none, which would leave the two dmgs ambiguous.
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  target:
    - dmg
    - zip
  extendInfo:
    NSMicrophoneUsageDescription: Reprise listens to your instrument for the tuner and practice tools.
win:
  target:
    - nsis
nsis:
  # One-click, per-user and no admin stay at electron-builder's defaults.
  artifactName: ${productName}-${version}-windows-${arch}-setup.${ext}
