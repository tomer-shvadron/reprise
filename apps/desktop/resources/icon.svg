<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Reprise</title>
  <!-- An end-repeat barline (dots, thin bar, thick bar) on an indigo tile: the sign that sends a
       player back to the top of a passage. Every gap and the thin bar are at least 56 px so the
       bars stay apart at 16 px. The tile group is replaced by a rounded body in the macOS icon. -->
  <g id="tile">
    <rect width="1024" height="1024" fill="#434a85"/>
    <rect x="8" y="8" width="1008" height="1008" fill="none" stroke="#a8b0f0" stroke-width="16"/>
  </g>
  <g id="mark" fill="#e0e4ff">
    <circle cx="360" cy="400" r="46"/>
    <circle cx="360" cy="624" r="46"/>
    <rect x="470" y="232" width="56" height="560" rx="10"/>
    <rect x="590" y="232" width="120" height="560" rx="14"/>
  </g>
</svg>
