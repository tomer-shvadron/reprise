<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Reprise</title>
  <!-- An end-repeat barline (dots, thin bar, thick bar) on a dark tile: the sign that sends a
       player back to the top of a passage. The mark stays inside the macOS 824 px body. -->
  <rect width="1024" height="1024" fill="#22243a"/>
  <rect x="6" y="6" width="1012" height="1012" fill="none" stroke="#4a4f7a" stroke-width="12"/>
  <g fill="#8b9bff">
    <circle cx="374" cy="400" r="46"/>
    <circle cx="374" cy="624" r="46"/>
    <rect x="494" y="232" width="34" height="560" rx="8"/>
    <rect x="576" y="232" width="120" height="560" rx="14"/>
  </g>
</svg>
